<style>


*{
   margin:0;
   padding:0;
   box-sizing:border-box;
   font-family:'Poppins',sans-serif;
}


body{
   background:#eef3fb;
   display:flex;
   justify-content:center;
   align-items:center;
   height:100vh;
   overflow:hidden;
}


.container{


   width:1250px;
   height:650px;


   display:flex;


   background:white;


   border-radius:25px;


   overflow:hidden;


   box-shadow:0 20px 60px rgba(0,0,0,.15);


}


/* LEFT PANEL */


.left{


   width:50%;


   background:linear-gradient(135deg,#2E2278,#1f4fa3);


   color:white;


   padding:60px 50px;


   position:relative;


}


.left::before{


content:"";


position:absolute;


width:250px;


height:250px;


background:rgba(255,255,255,.08);


border-radius:50%;


top:-80px;


left:-80px;


}


.left::after{


content:"";


position:absolute;


width:320px;


height:320px;


background:rgba(255,255,255,.06);


border-radius:50%;


bottom:-150px;


right:-100px;


}


.logo{


width:100%;


display:flex;


justify-content:flex-start;


align-items:center;


margin-bottom:35px;


background:transparent;


box-shadow:none;


padding:0;


}


.logo img{


width:340px;


height:auto;


object-fit:contain;


filter:drop-shadow(0px 8px 18px rgba(0,0,0,.35));


transition:.4s;


}


.logo img:hover{


transform:scale(1.03);


}


.left h1{


font-size:32px;


margin-bottom:10px;


}


.left h2{


font-size:26px;


font-weight:700;


white-space:nowrap;


letter-spacing:.3px;


margin-bottom:40px;


color:white;


}


.left ul{


list-style:none;


}


.left li{


margin-bottom:18px;


font-size:17px;


display:flex;


align-items:center;


gap:12px;


}


.left i{


color:#8fffaf;


}


.copyright{


position:absolute;


bottom:35px;


font-size:14px;


opacity:.8;


}


/* RIGHT PANEL */


.right{


width:50%;


display:flex;


justify-content:center;


align-items:center;


background:#fff;


}


.login-box{


width:400px;


}


.login-box h2{


font-size:34px;


color:#222;


margin-bottom:8px;


}


.login-box p{


color:#666;


margin-bottom:35px;


}


.input-box{


position:relative;


margin-bottom:22px;


}


.input-box input,
.input-box select{


   width:100%;


   padding:15px 50px;


   border:1px solid #ddd;


   border-radius:12px;


   font-size:15px;


   font-family:'Poppins',sans-serif;


   outline:none;


   transition:.3s;


   background:#fff;


   appearance:none;
   -webkit-appearance:none;
   -moz-appearance:none;


}


.input-box input:focus,
.input-box select:focus{


   border-color:#2E2278;


   box-shadow:0 0 10px rgba(46,34,120,.15);


}


.input-box i:first-child{


position:absolute;


left:18px;


top:17px;


color:#888;


}


.eye{


position:absolute;


right:18px;


top:17px;


cursor:pointer;


color:#777;


}


.login-btn{


width:100%;


padding:15px;


border:none;


border-radius:12px;


background:#2E2278;


color:white;


font-size:17px;


cursor:pointer;


transition:.3s;


margin-top:10px;


}


.login-btn:hover{


background:#1b185c;


transform:translateY(-2px);


}
.remember{


display:flex;


justify-content:space-between;


align-items:center;


margin-bottom:20px;


font-size:14px;


}


.remember a{


text-decoration:none;


color:#2E2278;


font-weight:600;


}


.remember label{


display:flex;


align-items:center;


gap:8px;


color:#555;


}


.remember input{


accent-color:#2E2278;


}


.bottom{


margin-top:25px;


text-align:center;


}


.bottom a{


text-decoration:none;


color:#2E2278;


font-weight:600;


}


.bottom a:hover{


text-decoration:underline;


}


/* MOBILE */


@media(max-width:900px){


.container{


flex-direction:column;


width:95%;


height:auto;


}


.left{


width:100%;


padding:40px;


}


.right{


padding:40px;


}


.login-box{


width:100%;


}


}
/* ===========================
  SIGNUP MODAL
=========================== */


.modal{


display:none;


position:fixed;


left:0;


top:0;


width:100%;


height:100%;


background:rgba(0,0,0,.55);


justify-content:center;


align-items:center;


z-index:9999;


}


.modal-content{


background:white;


width:430px;


padding:35px;


border-radius:20px;


box-shadow:0 25px 60px rgba(0,0,0,.35);


animation:popup .35s ease;


}


@keyframes popup{


from{


transform:scale(.85);


opacity:0;


}


to{


transform:scale(1);


opacity:1;


}


}


.close{


float:right;


font-size:28px;


cursor:pointer;


font-weight:bold;


}


.signup-btn{


width:100%;


padding:15px;


border:none;


background:#2E2278;


color:white;


font-size:17px;


border-radius:12px;


cursor:pointer;


margin-top:10px;


transition:.3s;


}


.signup-btn:hover{


background:#1d195d;


}
body.swal2-shown{


   overflow-y: auto !important;


   padding-right: 0 !important;


}
/* ===========================
  Role Dropdown
=========================== */


.role-select{


   color:#444;


   cursor:pointer;


}


/* Placeholder color */


.role-select option:first-child{


   color:#999;


}
.input-box{


   position:relative;


}
.role-box{


   position:relative;


}


.role-box::after{


   content:"\f107";


   font-family:"Font Awesome 6 Free";


   font-weight:900;


   position:absolute;


   right:18px;


   top:50%;


   transform:translateY(-50%);


   color:#777;


   pointer-events:none;


}
</style>

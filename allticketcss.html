<style>

/*==========================================================
                    ALL TICKETS PAGE
==========================================================*/

.tickets-page{

    padding:18px 20px;

    animation:fadeIn .35s ease;

}

/*==========================================================
                    PAGE HEADER
==========================================================*/

.ticket-page-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

}

.header-left h2{

    font-size:24px;

    color:#2E2278;

    font-weight:700;

    margin-bottom:2px;

}

.header-left h2 i{

    color:#E1A855;

    margin-right:8px;

}

.header-left p{

    color:#777;

    font-size:13px;

    margin:0;

}

.ticket-counter{

    background:#fff;

    width:120px;

    border-radius:12px;

    text-align:center;

    padding:12px;

    box-shadow:0 6px 18px rgba(0,0,0,.08);

    border-left:4px solid #E1A855;

}

.ticket-counter span{

    display:block;

    color:#777;

    font-size:12px;

    margin-bottom:2px;

}

.ticket-counter h2{

    color:#2E2278;

    font-size:24px;

    margin:0;

}

/*==========================================================
                    SEARCH CARD
==========================================================*/

.search-card{

    background:#fff;

    padding:10px 15px;

    border-radius:15px;

    margin-bottom:15px;

    box-shadow:0 8px 18px rgba(0,0,0,.06);

}

.search-box{

    display:flex;

    align-items:center;

    background:#F7F9FC;

    border:2px solid transparent;

    border-radius:10px;

    padding:10px 14px;

    transition:.30s;

}

.search-box:hover{

    border-color:#E1A855;

}

.search-box:focus-within{

    border-color:#2E2278;

    background:#fff;

}

.search-box i{

    color:#999;

    font-size:18px;

    margin-right:12px;

}

.search-box input{

    flex:1;

    border:none;

    background:none;

    outline:none;

    font-size:15px;

    font-family:Poppins;

}

.search-box input::placeholder{

    color:#999;

}

/*==========================================================
                    FILTER CARD
==========================================================*/

.filter-card{

    background:#fff;

    border-radius:15px;

    padding:15px;

    margin-bottom:15px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:12px;

    box-shadow:0 8px 18px rgba(0,0,0,.06);

}

.filter-group{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

}

.filter-group input,
.filter-group select{

    width:160px;

    height:42px;

    padding:0 12px;

    border:1px solid #DDD;

    border-radius:10px;

    outline:none;

    font-size:13px;

    font-family:Poppins;

    transition:.30s;

    background:#fff;

}

.filter-group input:focus,
.filter-group select:focus{

    border-color:#2E2278;

    box-shadow:0 0 0 3px rgba(46,34,120,.10);

}

/*==========================================================
                FILTER BUTTONS
==========================================================*/

.filter-buttons{

    display:flex;

    gap:10px;

}

.btn-primary{

    background:#2E2278;

    color:#fff;

    border:none;

    border-radius:10px;

    padding:12px 24px;

    cursor:pointer;

    font-family:Poppins;

    font-size:14px;

    font-weight:600;

    transition:.30s;

}

.btn-primary:hover{

    background:#241B63;

    transform:translateY(-2px);

    box-shadow:0 8px 18px rgba(46,34,120,.25);

}

.btn-warning{

    background:#E1A855;

    color:#fff;

    border:none;

    border-radius:10px;

    padding:12px 20px;

    cursor:pointer;

    font-family:Poppins;

    font-size:14px;

    font-weight:600;

    transition:.30s;

}

.btn-warning:hover{

    background:#C98D2D;

    transform:translateY(-2px);

    box-shadow:0 8px 18px rgba(225,168,85,.30);

}

/*==========================================================
                    FADE ANIMATION
==========================================================*/

@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(15px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}
/*==========================================================
                    TOOLBAR
==========================================================*/

.toolbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:15px;

    background:#fff;

    padding:12px 18px;

    border-radius:15px;

    margin-bottom:15px;

    box-shadow:0 8px 18px rgba(0,0,0,.06);

}

.toolbar-left{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

}

.toolbar-right{

    display:flex;

    align-items:center;

    font-size:15px;

    font-weight:600;

    color:#555;

}

.toolbar-btn{

    height:42px;

    padding:0 18px;

    border:none;

    outline:none;

    cursor:pointer;

    border-radius:10px;

    font-family:Poppins;

    font-size:13px;

    font-weight:600;

    transition:.30s;

    color:#fff;

}

.toolbar-btn i{

    margin-right:8px;

}

.toolbar-btn:hover{

    transform:translateY(-2px);

}

.excel{

    background:#1D9E54;

}

.excel:hover{

    box-shadow:0 10px 20px rgba(29,158,84,.30);

}

.pdf{

    background:#E53935;

}

.pdf:hover{

    box-shadow:0 10px 20px rgba(229,57,53,.30);

}

.print{

    background:#455A64;

}

.print:hover{

    box-shadow:0 10px 20px rgba(69,90,100,.30);

}

.refresh{

    background:#2E2278;

}

.refresh:hover{

    box-shadow:0 10px 20px rgba(46,34,120,.30);

}

/*==========================================================
                    TABLE CARD
==========================================================*/

.table-card{

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 12px 30px rgba(0,0,0,.07);

}

/*==========================================================
                    TABLE
==========================================================*/

.ticket-table{

    width:100%;

    border-collapse:collapse;

    font-size:14px;

}

.ticket-table thead{

    background:#2E2278;

    color:#fff;

}

.ticket-table thead th{

    padding:18px;

    text-align:left;

    font-weight:600;

    position:sticky;

    top:0;

    z-index:5;

}

.ticket-table tbody td{

    padding:16px;

    border-bottom:1px solid #ECECEC;

    color:#444;

    transition:.20s;

}

.ticket-table tbody tr{

    transition:.25s;

}

.ticket-table tbody tr:hover{

    background:#F6F8FF;

}

.ticket-table tbody tr:last-child td{

    border-bottom:none;

}

/*==========================================================
                STATUS BADGES
==========================================================*/

.status{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:6px 14px;

    border-radius:30px;

    font-size:12px;

    font-weight:700;

    letter-spacing:.3px;

}

.status-open{

    background:#FFE5E5;

    color:#D32F2F;

}

.status-accepted{

    background:#E3F2FD;

    color:#1976D2;

}

.status-pending{

    background:#FFF3CD;

    color:#F57C00;

}

.status-reopen{

    background:#F3E5F5;

    color:#8E24AA;

}

.status-closed{

    background:#E8F5E9;

    color:#2E7D32;

}

/*==========================================================
                PRIORITY BADGES
==========================================================*/

.priority{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:6px 14px;

    border-radius:30px;

    font-size:12px;

    font-weight:700;

}

.priority-immediate{

    background:#FFCDD2;

    color:#B71C1C;

}

.priority-high{

    background:#FFE0B2;

    color:#E65100;

}

.priority-normal{

    background:#E3F2FD;

    color:#1565C0;

}

.priority-low{

    background:#E8F5E9;

    color:#2E7D32;

}

/*==========================================================
          ALL TICKETS ACTION BUTTONS
==========================================================*/

.all-ticket-actions{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    width:100%;

    white-space:nowrap;

}


/*==========================================================
          COMMON ACTION BUTTON
==========================================================*/

.all-ticket-action-btn{

    width:40px;

    height:40px;

    min-width:40px;

    padding:0;

    border:none;

    border-radius:9px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    color:#fff;

    font-size:14px;

    transition:all .25s ease;

}
/* ==========================================================
   COMPUTER DETAILS BUTTON
========================================================== */

.all-ticket-asset-btn {

    background:#16A085;

    color:#fff;

}


.all-ticket-asset-btn:hover {

    background:#12806A;

    transform:translateY(-2px);

    box-shadow:
        0 5px 12px rgba(22,160,133,.30);

}


/*==========================================================
                    VIEW BUTTON
==========================================================*/

.all-ticket-view-btn{

    background:#3498DB;

}

.all-ticket-view-btn:hover{

    background:#2478B5;

    transform:translateY(-2px);

    box-shadow:0 5px 12px rgba(52,152,219,.25);

}


/*==========================================================
                  UPDATE BUTTON
==========================================================*/

.all-ticket-update-btn{

    background:#E1A855;

}

.all-ticket-update-btn:hover{

    background:#C98D2D;

    transform:translateY(-2px);

    box-shadow:0 5px 12px rgba(225,168,85,.30);

}


/*==========================================================
                  ACTION COLUMN
==========================================================*/

.ticket-table th:last-child,
.ticket-table td:last-child{

    width:110px;

    min-width:110px;

    text-align:center;

    white-space:nowrap;

}


/*==========================================================
                  BUTTON PRESS EFFECT
==========================================================*/

.all-ticket-action-btn:active{

    transform:scale(.94);

}

/*==========================================================
                EMPTY STATE
==========================================================*/

.empty-state{

    padding:80px 20px;

    text-align:center;

}

.empty-state i{

    font-size:70px;

    color:#D5D5D5;

    margin-bottom:20px;

}

.empty-state h3{

    color:#555;

    font-size:24px;

    margin-bottom:10px;

}

.empty-state p{

    color:#888;

    font-size:14px;

}
/*==========================================================
                    PAGINATION
==========================================================*/

.pagination-bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:20px;

    margin-top:25px;

    background:#fff;

    padding:18px 22px;

    border-radius:15px;

    box-shadow:0 10px 25px rgba(0,0,0,.06);

}

.pagination-bar select{

    padding:8px 14px;

    border:1px solid #ddd;

    border-radius:8px;

    font-family:Poppins;

    outline:none;

}

.pagination-buttons{

    display:flex;

    align-items:center;

    gap:8px;

}

.pagination-buttons button{

    width:40px;

    height:40px;

    border:none;

    border-radius:10px;

    background:#EEF2FF;

    color:#2E2278;

    cursor:pointer;

    transition:.25s;

    font-weight:600;

}

.pagination-buttons button:hover{

    background:#2E2278;

    color:#fff;

}

.pagination-buttons .active{

    background:#E1A855;

    color:#fff;

}

/*==========================================================
                TABLE SCROLL
==========================================================*/

.table-card{

    overflow-x:auto;

}

.table-card::-webkit-scrollbar{

    height:8px;

}

.table-card::-webkit-scrollbar-track{

    background:#ECECEC;

}

.table-card::-webkit-scrollbar-thumb{

    background:#B5B5B5;

    border-radius:20px;

}

.table-card::-webkit-scrollbar-thumb:hover{

    background:#8E8E8E;

}

/*==========================================================
                INPUT PLACEHOLDER
==========================================================*/

input::placeholder{

    color:#9A9A9A;

}

select{

    cursor:pointer;

}

/*==========================================================
                SMOOTH TRANSITION
==========================================================*/

button,
input,
select,
table,
td,
th{

    transition:.25s;

}

/*==========================================================
                CARD HOVER
==========================================================*/

.search-card,
.filter-card,
.toolbar,
.table-card,
.ticket-counter{

    transition:.30s;

}

.search-card:hover,
.filter-card:hover,
.toolbar:hover,
.table-card:hover{

    box-shadow:0 15px 35px rgba(0,0,0,.10);

}

/*==========================================================
                TEXT HELPERS
==========================================================*/

.text-center{

    text-align:center;

}

.text-right{

    text-align:right;

}

.text-left{

    text-align:left;

}

.font-bold{

    font-weight:600;

}

/*==========================================================
                FLEX HELPERS
==========================================================*/

.d-flex{

    display:flex;

}

.justify-between{

    justify-content:space-between;

}

.align-center{

    align-items:center;

}

.gap-10{

    gap:10px;

}

.gap-15{

    gap:15px;

}

.gap-20{

    gap:20px;

}

/*==========================================================
                SHADOW HELPERS
==========================================================*/

.shadow-sm{

    box-shadow:0 5px 12px rgba(0,0,0,.05);

}

.shadow-md{

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.shadow-lg{

    box-shadow:0 18px 40px rgba(0,0,0,.12);

}

/*==========================================================
                BORDER RADIUS
==========================================================*/

.radius-10{

    border-radius:10px;

}

.radius-15{

    border-radius:15px;

}

.radius-20{

    border-radius:20px;

}

/*==========================================================
                RESPONSIVE
==========================================================*/

@media(max-width:1200px){

.filter-card{

    flex-direction:column;

    align-items:flex-start;

}

.filter-group{

    width:100%;

}

.filter-group input,
.filter-group select{

    flex:1;

    width:100%;

}

.toolbar{

    flex-direction:column;

    align-items:flex-start;

}

.toolbar-left{

    width:100%;

    flex-wrap:wrap;

}

.toolbar-right{

    width:100%;

    justify-content:flex-end;

}

.ticket-page-header{

    flex-direction:column;

    align-items:flex-start;

    gap:15px;

}

.ticket-counter{

    width:100%;

}

}

@media(max-width:768px){

.tickets-page{

    padding:15px;

}

.header-left h2{

    font-size:22px;

}

.search-box{

    padding:12px;

}

.search-box input{

    font-size:14px;

}

.toolbar-btn{

    width:100%;

}

.toolbar-left{

    width:100%;

}

.pagination-bar{

    flex-direction:column;

    align-items:flex-start;

}

.pagination-buttons{

    width:100%;

    justify-content:center;

}

.ticket-table{

    min-width:1100px;

}

}

@media(max-width:480px){

.ticket-counter h2{

    font-size:24px;

}

.ticket-counter{

    padding:15px;

}

.header-left p{

    font-size:13px;

}

}
.search-filter-card{

    background:#fff;

    padding:16px 18px;

    border-radius:15px;

    margin-bottom:15px;

    box-shadow:0 8px 18px rgba(0,0,0,.06);

}

.filter-row{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:15px;

}

.filter-row input,
.filter-row select{

    height:42px;

    width:160px;

    border:1px solid #DDD;

    border-radius:10px;

    padding:0 12px;

    font-family:Poppins;

}

.filter-row input:focus,
.filter-row select:focus{

    border-color:#2E2278;

    box-shadow:0 0 0 3px rgba(46,34,120,.10);

}

/*==========================================================
                END OF ALL TICKETS CSS
==========================================================*/

</style>

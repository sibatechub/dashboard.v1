<style>

/* =====================================================
   FEEDBACK PAGE
===================================================== */

.feedback-page {
    padding: 25px;
    width: 100%;
    box-sizing: border-box;
}


/* =====================================================
   HEADER
===================================================== */

.feedback-header {
    margin-bottom: 22px;
}

.feedback-header h1 {
    margin: 0;
    color: #2E2278;
    font-size: 28px;
    font-weight: 700;
}

.feedback-header h1 i {
    margin-right: 8px;
}

.feedback-header p {
    margin: 5px 0 0;
    color: #777;
    font-size: 14px;
}


/* =====================================================
   SUMMARY CARDS
===================================================== */

.feedback-summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 22px;
}

.feedback-summary-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    min-height: 110px;
    box-sizing: border-box;
}

.feedback-icon {
    width: 55px;
    height: 55px;
    min-width: 55px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.rating-icon {
    background: #e8f7ef;
    color: #159447;
}

.behaviour-icon {
    background: #e9f0ff;
    color: #2864d7;
}

.resolution-icon {
    background: #fff1df;
    color: #ed8b16;
}

.total-icon {
    background: #f0e9ff;
    color: #6339c9;
}

.feedback-summary-card span {
    color: #777;
    font-size: 13px;
    display: block;
    margin-bottom: 5px;
}

.feedback-summary-card h2 {
    margin: 0;
    color: #242424;
    font-size: 25px;
    font-weight: 700;
}

.feedback-summary-card p {
    margin: 5px 0 0;
    color: #888;
    font-size: 11px;
}

.feedback-summary-card p b {
    color: #2E2278;
}


/* =====================================================
   SECTIONS
===================================================== */

.feedback-section {
    background: #ffffff;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.feedback-section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.feedback-section-title h2 {
    margin: 0;
    color: #2E2278;
    font-size: 18px;
    font-weight: 700;
}

.feedback-section-title h2 i {
    margin-right: 7px;
}


/* =====================================================
   TABLE
===================================================== */

.feedback-table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.feedback-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

.feedback-table thead th {
    background: #2E2278;
    color: #ffffff;
    padding: 13px 12px;
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.feedback-table thead th:first-child {
    border-radius: 8px 0 0 8px;
}

.feedback-table thead th:last-child {
    border-radius: 0 8px 8px 0;
}

.feedback-table tbody td {
    padding: 13px 12px;
    border-bottom: 1px solid #eeeeee;
    color: #444;
    font-size: 12px;
    vertical-align: middle;
}

.feedback-table tbody tr:hover {
    background: #faf9ff;
}

.feedback-table tbody tr:last-child td {
    border-bottom: none;
}


/* =====================================================
   RATING BADGE
===================================================== */

.feedback-rating {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: 700;
    white-space: nowrap;
}

.feedback-rating i {
    color: #f2a900;
}

.rating-high {
    background: #e7f6eb;
    color: #176b35;
}

.rating-medium {
    background: #fff4dc;
    color: #956500;
}

.rating-low {
    background: #ffe8e8;
    color: #a52c2c;
}


/* =====================================================
   TEXT BADGES
===================================================== */

.feedback-text-badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
}

.behaviour-badge {
    background: #e8f6eb;
    color: #22743b;
}

.resolution-badge {
    background: #eaf1ff;
    color: #285bb5;
}


/* =====================================================
   FILTER SECTION
===================================================== */

.feedback-filter-section {
    background: #ffffff;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.feedback-filter-section select,
.feedback-search input {
    height: 40px;
    border: 1px solid #dddddd;
    border-radius: 8px;
    padding: 0 12px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    outline: none;
    background: #ffffff;
    box-sizing: border-box;
}

.feedback-filter-section select:focus,
.feedback-search input:focus {
    border-color: #2E2278;
}

.feedback-search {
    position: relative;
    flex: 1;
    min-width: 180px;
}

.feedback-search i {
    position: absolute;
    left: 13px;
    top: 13px;
    color: #888;
    font-size: 13px;
}

.feedback-search input {
    width: 100%;
    padding-left: 35px;
}


/* =====================================================
   BUTTONS
===================================================== */

.feedback-primary-btn,
.feedback-secondary-btn {
    height: 40px;
    padding: 0 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
}

.feedback-primary-btn {
    background: #2E2278;
    color: #ffffff;
}

.feedback-primary-btn:hover {
    background: #241a63;
}

.feedback-secondary-btn {
    background: #eeeeee;
    color: #444;
}

.feedback-secondary-btn:hover {
    background: #dddddd;
}


/* =====================================================
   LOADING / EMPTY
===================================================== */

.feedback-loading {
    text-align: center !important;
    padding: 30px !important;
    color: #888 !important;
}

.feedback-empty {
    text-align: center !important;
    padding: 35px !important;
    color: #888 !important;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1200px) {

    .feedback-summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 700px) {

    .feedback-page {
        padding: 15px;
    }

    .feedback-summary-grid {
        grid-template-columns: 1fr;
    }

    .feedback-filter-section {
        flex-direction: column;
        align-items: stretch;
    }

    .feedback-search {
        width: 100%;
    }

    .feedback-filter-section select,
    .feedback-primary-btn,
    .feedback-secondary-btn {
        width: 100%;
    }

}

</style>

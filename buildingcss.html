/* ==========================================
   EDIT BUILDING MODAL
========================================== */

.building-modal{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.45);

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:9999;

}

.building-modal-content{

    width:500px;

    background:#fff;

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,.25);

    animation:popup .25s ease;

}

@keyframes popup{

    from{
        transform:scale(.9);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.building-modal-header{

    background:#2E2278;

    color:#fff;

    padding:18px 22px;

    display:flex;
    justify-content:space-between;

<script>
 let allUsers = [];
function renderUsers(users){


   let html = "";


   users.forEach(function(user){


       html += `
       <tr>


           <td>${user.name}</td>


           <td>${user.userId}</td>


           <td>${user.email}</td>


           <td>


               <div class="password-box">


                   <span id="pwd_${user.userId}">
                       ********
                   </span>


                   <button class="action-btn view-btn"
                   onclick="togglePassword('${user.userId}','${user.password}')">


                       <i id="icon_${user.userId}"
                       class="fa-solid fa-eye"></i>


                   </button>


               </div>


           </td>


           <td>${user.mobile}</td>


           <td>${user.role}</td>


           <td>${getStatusBadge(user.status)}</td>


           <td>${getActionButtons(user)}</td>


       </tr>
       `;


   });


   if(users.length===0){


       html=`
       <tr>


           <td colspan="8">


               No Users Found


           </td>


       </tr>
       `;


   }


   document.getElementById("usersTableBody").innerHTML=html;


}
function applyFilters(){


   const search = document.getElementById("txtSearchUser")
       .value
       .trim()
       .toLowerCase();


   const role = document.getElementById("filterRole").value;


   const status = document.getElementById("filterStatus").value;


   const filteredUsers = allUsers.filter(function(user){


       // Search
const matchSearch =
   String(user.name).toLowerCase().includes(search) ||
   String(user.userId).toLowerCase().includes(search) ||
   String(user.email).toLowerCase().includes(search);


       // Role
       const matchRole =
           role === "" || user.role === role;


       // Status
       const matchStatus =
           status === "" || user.status === status;


       return matchSearch && matchRole && matchStatus;


   });


   renderUsers(filteredUsers);


}


function loadUsers(){


   console.log("Loading users...");


   google.script.run


   .withSuccessHandler(function(users){


       console.log(users);


       allUsers = users;


       renderUsers(allUsers);


   })


   .withFailureHandler(function(err){


       console.error(err);


   })


   .getUsers();


}
function loadRoleFilter(){


   google.script.run


   .withSuccessHandler(function(roles){


       const filter = document.getElementById("filterRole");


       filter.innerHTML = `<option value="">All Roles</option>`;


       roles.forEach(function(role){


           filter.innerHTML += `


               <option value="${role}">


                   ${role}


               </option>


           `;


       });


   })


   .getRoles();


}
function getStatusBadge(status){


   status = String(status).trim().toUpperCase();


   if(status === "YES"){


       return `
           <span class="status active">
               <i class="fa-solid fa-circle"></i>
               Active
           </span>
       `;


   }


   if(status === "PENDING"){


       return `
           <span class="status pending">
               <i class="fa-solid fa-circle"></i>
               Pending
           </span>
       `;


   }


   if(status === "REJECTED"){


       return `
           <span class="status rejected">
               <i class="fa-solid fa-circle"></i>
               Rejected
           </span>
       `;


   }
   if(status == "DISABLED"){


   return `
   <span class="status disabled">
       ● Disabled
   </span>
   `;


}


   return status;


}
function getActionButtons(user){


   let html = "";
   const status = user.status.toString().trim().toUpperCase();


   // View
   html += `
       <button class="action-btn view-btn"
           onclick="viewUser('${user.userId}')">


           <i class="fa-solid fa-eye"></i>


       </button>
   `;


   if(status === "YES"){


   html += `
       <button class="action-btn edit-btn"
           onclick="editUser('${user.userId}')">


           <i class="fa-solid fa-pen"></i>


       </button>


       <button class="action-btn disable-btn"
           onclick="disableUser('${user.userId}')">


           <i class="fa-solid fa-ban"></i>


       </button>
   `;


}
else if(status === "PENDING"){


   html += `
       <button class="action-btn edit-btn"
           onclick="editUser('${user.userId}')">


           <i class="fa-solid fa-pen"></i>


       </button>


       <button class="action-btn approve-btn"
           onclick="approveUser('${user.userId}')">


           <i class="fa-solid fa-check"></i>


       </button>


       <button class="action-btn reject-btn"
           onclick="rejectUser('${user.userId}')">


           <i class="fa-solid fa-xmark"></i>


       </button>
   `;


}
else if(status === "DISABLED"){


   html += `
       <button class="action-btn edit-btn"
           onclick="editUser('${user.userId}')">


           <i class="fa-solid fa-pen"></i>


       </button>


       <button class="action-btn approve-btn"
           onclick="enableUser('${user.userId}')">


           <i class="fa-solid fa-check"></i>


       </button>
   `;


}
else if(status === "REJECTED"){


   html += `
       <button class="action-btn edit-btn"
           onclick="editUser('${user.userId}')">


           <i class="fa-solid fa-pen"></i>


       </button>


       <button class="action-btn approve-btn"
           onclick="approveUser('${user.userId}')">


           <i class="fa-solid fa-check"></i>


       </button>
   `;


}


return html;


}

}).then((result)=>{

           });


           loadUsers();


       }


   })


   .updateUser(result.value);


});


       })


       .getRoles();


   })


   .getUserDetails(userId);


}


function approveUser(userId){


   Swal.fire({


       title:"Approve User?",


       text:"Do you want to activate this account?",


       icon:"question",


       showCancelButton:true,


       confirmButtonText:"Approve",


       confirmButtonColor:"#2E2278"


   }).then((result)=>{


       if(!result.isConfirmed) return;


       google.script.run


       .withSuccessHandler(function(success){


           if(success){


               Swal.fire({


                   icon:"success",


                   title:"Approved",


                   text:"User account activated successfully."


               });


               loadUsers();


           }


       })


       .approveUserAccount(userId);


   });


}


function rejectUser(userId){


   Swal.fire({


       title:"Reject User?",


       text:"Do you want to reject this account?",


       icon:"warning",


       showCancelButton:true,


       confirmButtonText:"Reject",


       confirmButtonColor:"#E74C3C"


   }).then((result)=>{


       if(!result.isConfirmed) return;


       google.script.run


       .withSuccessHandler(function(success){


           if(success){


               Swal.fire({


                   icon:"success",


                   title:"Rejected",


                   text:"User account rejected."


               });


               loadUsers();


           }


       })


       .rejectUserAccount(userId);


   });


}
function disableUser(userId){


   Swal.fire({


       title: "Disable User?",


       text: "The user will not be able to login.",


       icon: "warning",


       showCancelButton: true,


       confirmButtonColor: "#555",


       confirmButtonText: "Disable"


   }).then((result)=>{


       if(!result.isConfirmed) return;


       google.script.run


       .withSuccessHandler(function(success){


           if(success){


               Swal.fire({


                   icon:"success",


                   title:"Disabled",


                   text:"User account disabled successfully."


               });


               loadUsers();


           }


       })


       .disableUserAccount(userId);


   });


}


function enableUser(userId){


   Swal.fire({


       title: "Enable User?",


       text: "The user account will be activated.",


       icon: "question",


       showCancelButton: true,


       confirmButtonColor: "#2E2278",


       confirmButtonText: "Enable"


   }).then((result)=>{


       if(!result.isConfirmed) return;


       google.script.run


       .withSuccessHandler(function(success){


           if(success){


               Swal.fire({


                   icon:"success",


                   title:"Enabled",


                   text:"User account enabled successfully."


               });


               loadUsers();


           }


       })


       .enableUserAccount(userId);


   });


}
function togglePassword(userId,password){


   const span = document.getElementById("pwd_"+userId);


   const icon = document.getElementById("icon_"+userId);


   if(span.innerText === "********"){


       span.innerText = password;


       icon.classList.remove("fa-eye");


       icon.classList.add("fa-eye-slash");


   }else{


       span.innerText = "********";


       icon.classList.remove("fa-eye-slash");


       icon.classList.add("fa-eye");


   }


}
function toggleEditPassword(){


   const pwd = document.getElementById("editPassword");


   const icon = document.getElementById("editPwdIcon");


   if(pwd.type === "password"){


       pwd.type = "text";


       icon.classList.remove("fa-eye");


       icon.classList.add("fa-eye-slash");


   }else{


       pwd.type = "password";


       icon.classList.remove("fa-eye-slash");


       icon.classList.add("fa-eye");


   }


}
// ==============================
// USER FILTER EVENTS
// ==============================


document.getElementById("txtSearchUser")
.addEventListener("keyup", applyFilters);


document.getElementById("filterRole")
.addEventListener("change", applyFilters);


document.getElementById("filterStatus")
.addEventListener("change", applyFilters);
// Load users and role filter
loadUsers();
loadRoleFilter();


</script>
